docker-compose-yaml: docker-compose.yml

project: aed-static-sites

environment_variables:
  git_sha: 'true'

routes:
  insecure: Redirect

_route: &ROUTE
 tls-acme: 'true'
 insecure: Redirect
 hsts: max-age=31536000;includeSubDomains;preload

environments:
  main:
    routes:
      - nginx:
           - drupalcamp.es: *ROUTE
           - www.drupalcamp.es: *ROUTE
